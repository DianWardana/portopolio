# ============================================================
# NGINX CONFIGURATION FOR PORTFOLIO + API
# ============================================================
# Frontend: React (SPA)
# Backend: CodeIgniter 4 (PHP)
# SSL: Let's Encrypt
# 
# Installation:
# 1. Copy this file to: /etc/nginx/sites-available/
# 2. Enable with: sudo ln -s sites-available/porto.conf sites-enabled/
# 3. Test with: sudo nginx -t
# 4. Reload with: sudo systemctl reload nginx
# ============================================================

# ============================================================
# FRONTEND - React SPA (porto.domain.com)
# ============================================================

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name porto.domain.com;
    return 301 https://$server_name$request_uri;
}

# HTTPS - Frontend
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name porto.domain.com;
    root /var/www/porto;
    index index.html;
    
    # ========== SSL/TLS CONFIGURATION ==========
    ssl_certificate /etc/letsencrypt/live/porto.domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/porto.domain.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/porto.domain.com/chain.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    
    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;
    
    # ========== SECURITY HEADERS ==========
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.domain.com;" always;
    
    # ========== COMPRESSION ==========
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml application/atom+xml image/svg+xml;
    gzip_min_length 1024;
    gzip_disable "msie6";
    
    # ========== CACHING ==========
    # Static assets - long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable, max-age=2592000";
        access_log off;
        log_not_found off;
    }
    
    # ========== SPA ROUTING ==========
    # All requests go to index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;
        
        # Don't cache HTML
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    
    # ========== DENY SENSITIVE FILES ==========
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # ========== LOGGING ==========
    access_log /var/log/nginx/porto_access.log;
    error_log /var/log/nginx/porto_error.log warn;
}

# ============================================================
# BACKEND - CodeIgniter 4 API (api.domain.com)
# ============================================================

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name api.domain.com;
    return 301 https://$server_name$request_uri;
}

# HTTPS - Backend API
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.domain.com;
    
    root /var/www/api/public;
    index index.php;
    
    # ========== SSL/TLS CONFIGURATION ==========
    ssl_certificate /etc/letsencrypt/live/api.domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.domain.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/api.domain.com/chain.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    
    # ========== SECURITY HEADERS ==========
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # ========== CORS HEADERS ==========
    # Allow frontend domain
    add_header Access-Control-Allow-Origin "https://porto.domain.com" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
    add_header Access-Control-Allow-Headers "DNT, X-CustomHeader, Keep-Alive, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type, Authorization" always;
    add_header Access-Control-Max-Age "1728000" always;
    
    # Handle preflight requests
    if ($request_method = 'OPTIONS') {
        return 204;
    }
    
    # ========== COMPRESSION ==========
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types application/json text/plain text/xml text/css application/xml+rss;
    gzip_min_length 1024;
    
    # ========== CACHING ==========
    # API responses - no cache
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
    
    # ========== CI4 ROUTING ==========
    # Deny access to sensitive directories
    location ~ ^/(app|writable|vendor)/ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Deny access to files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # All requests to index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # ========== PHP-FPM CONFIGURATION ==========
    location ~ \.php$ {
        # Check if file exists
        try_files $uri =404;
        
        # FastCGI configuration
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        
        # Include FastCGI parameters
        include fastcgi_params;
        
        # Additional FastCGI parameters
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param CI_ENVIRONMENT production;
        
        # Timeout settings
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
        
        # Buffer settings
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
    }
    
    # ========== STATIC FILES ==========
    # Don't pass these to PHP-FPM
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }
    
    # ========== LOGGING ==========
    access_log /var/log/nginx/api_access.log combined;
    error_log /var/log/nginx/api_error.log warn;
}

# ============================================================
# REDIRECT BARE DOMAIN TO FRONTEND
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name domain.com;
    return 301 https://porto.domain.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name domain.com;
    
    ssl_certificate /etc/letsencrypt/live/domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/domain.com/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    return 301 https://porto.domain.com$request_uri;
}

# ============================================================
# NOTES & TIPS
# ============================================================
# 
# 1. BEFORE USING THIS CONFIG:
#    - Replace "domain.com" with your actual domain
#    - Replace "porto.domain.com" with frontend subdomain
#    - Replace "api.domain.com" with backend subdomain
#    - Get SSL certificates first:
#      sudo certbot certonly --standalone -d domain.com,porto.domain.com,api.domain.com
#
# 2. CHECK SYNTAX:
#    sudo nginx -t
#    Expected: "nginx: configuration file test is successful"
#
# 3. ENABLE CONFIG:
#    sudo ln -s /etc/nginx/sites-available/yourconfig.conf /etc/nginx/sites-enabled/
#
# 4. TEST BEFORE GOING LIVE:
#    - Test with: sudo nginx -t
#    - Reload with: sudo systemctl reload nginx
#    - Check logs: sudo tail -f /var/log/nginx/error.log
#
# 5. SECURITY CHECKS:
#    - SSL Rating: https://www.ssllabs.com/ssltest/
#    - Security Headers: https://securityheaders.com/
#    - Mozilla Config Generator: https://ssl-config.mozilla.org/
#
# 6. PERFORMANCE TUNING:
#    - Enable keepalive: keepalive_timeout 65;
#    - Buffer sizes: adjust based on request size
#    - Worker processes: worker_processes auto;
#
# 7. MONITORING:
#    - Access logs: /var/log/nginx/access.log
#    - Error logs: /var/log/nginx/error.log
#    - Real-time: tail -f /var/log/nginx/access.log
#
# ============================================================
